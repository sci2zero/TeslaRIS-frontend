name: TeslaRIS Frontend Deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        default: ''
        required: false
      environment:
        description: 'Deploy environment'
        type: environment
        required: false
      skip_tests:
        description: 'Skip running tests'
        default: false
        type: boolean
      without_deploy:
        description: 'Only build (without deploy)'
        default: false
        type: boolean
  push:
    branches:
      - main
    tags:
      - 'v*' # Trigger on version tags (e.g., v1.0.0)

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment || 'demo' }}
    env:
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      TENANT: ${{ vars.TENANT || inputs.environment || 'demo' }}
      VITE_BASE_URL: ${{ vars.API_URL }}
      VITE_RECAPTCHA_SITE_KEY: ${{ vars.RECAPTCHA_SITE_KEY }}
      VITE_APP_VERSION: ${{ inputs.version }}
      VITE_UNPAYWALL_EMAIL: ${{ vars.UNPAYWALL_EMAIL }}
      VITE_SERVER_TIMEZONE: ${{ vars.SERVER_TIMEZONE }}
      VITE_COMMON_SURNAME_SUFFIXES: ${{ vars.COMMON_SURNAME_SUFFIXES }}
    steps:

      - uses: actions/checkout@v4

      - name: Checkout tenant configurations
        uses: actions/checkout@v4
        with:
          repository: sci2zero/tenant-configurations
          path: tenant-configurations
          token: ${{ secrets.TENANT_CONFIG_TOKEN || github.token }}
          sparse-checkout: ${{ env.TENANT }}/frontend
          sparse-checkout-cone-mode: true

      - name: Overlay tenant frontend files
        run: |
          TENANT_DIR="tenant-configurations/${TENANT}/frontend"
          if [ ! -d "$TENANT_DIR" ]; then
            echo "No overlay directory at $TENANT_DIR; skipping"
            rm -rf tenant-configurations
            exit 0
          fi
          echo "Merging $TENANT_DIR into the frontend tree"
          rsync -a "$TENANT_DIR/" ./
          rm -rf tenant-configurations

      - name: Set custom environment variables (commit SHA and ref)
        run: |
          echo "VITE_FRONTEND_GIT_COMMIT_HASH=${GITHUB_SHA}" >> $GITHUB_ENV
          echo "VITE_FRONTEND_GIT_TAG=${GITHUB_REF}" >> $GITHUB_ENV
          echo "VITE_FRONTEND_GITHUB_REPO=${REPO_URL}" >> $GITHUB_ENV

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Install package dependencies
        run: npm ci

      - name: Lint project
        if: ${{ !inputs.skip_tests }}
        run: npm run lint

      - name: Build dist files
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: teslaris-frontend
          path: dist/


  deploy-frontend:
    runs-on: ubuntu-latest
    if: ${{ !inputs.without_deploy }}
    needs: build-frontend
    environment:
      name: ${{ inputs.environment || 'test' }}

    steps:

      - uses: actions/download-artifact@v4
        with:
          name: teslaris-frontend
          path: teslaris

      - name: Copy files to Server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_PRIVATE_KEY }}
          source: "teslaris"
          target: "tmp/github-frontend"


      - name: Deploy application to blue node
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_PRIVATE_KEY }}
          script: |
            /opt/teslaris/deploy-frontend-script.sh deploy-blue

  start-new-frontend:
    runs-on: ubuntu-latest
    if: ${{ !inputs.without_deploy }}

    needs: deploy-frontend
    environment:
      name: ${{ inputs.environment || 'test' }}
    steps:
      - name: Apply blue node
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_PRIVATE_KEY }}
          script: |
            chmod +x /opt/teslaris/deploy-script.sh
            /opt/teslaris/deploy-frontend-script.sh apply-blue
